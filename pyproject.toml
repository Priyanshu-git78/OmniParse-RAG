[project]
name = "rag-industry-level"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "en-core-web-sm",
    "jupyter>=1.1.1",
    "lab>=8.10",
    "langchain-classic>=1.0.8",
    "langchain-cohere>=0.6.0",
    "langchain-community",
    "langchain-core",
    "langchain-google-vertexai",
    "langchain-huggingface>=1.2.2",
    "langchain-postgres>=0.0.17",
    "langchain-openai>=0.1",
    "onnxruntime>=1.27.0",
    "pdfplumber>=0.11.10",
    "pip>=26.1.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ragas>=0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8",
    "streamlit>=1.59.1",
    "thinc>=8.3",
    "transformers>=5.13.0",
    "unstructured[docx,pdf,pptx,xlsx]>=0.24.0",
    "pytest>=9.1.1",
    "langsmith",
    "onnxruntime-gpu>=1.28.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/simple"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
[tool.setuptools]

[tool.pytest.ini_options]
markers = [
    "integration: real API calls, needs live services",
    "unit: fast unit tests, no API calls",
    "slow: slow running tests",
]
